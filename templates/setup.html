<!DOCTYPE html>
<html lang="{{ lang or 'es-ES' }}" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ _('Setup') }} - TolochaTV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/tolocha-theme.css?v={{ asset_version }}">
</head>
<body class="h-full bg-gray-900 text-gray-100 flex items-center justify-center tolocha-auth">
  <div class="tolocha-auth-card p-8 rounded-lg w-full max-w-md">
    <h1 class="tolocha-brand text-3xl font-bold text-center mb-2">TolochaTV</h1>
    <p class="text-center text-gray-400 mb-8">{{ _('Create your admin account') }}</p>

    {% if error %}
    <div class="tolocha-error rounded p-3 mb-4 text-sm">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/setup" class="space-y-4">
      <div>
        <label class="block text-sm mb-1">{{ _('Username') }}</label>
        <input type="text" name="username" required minlength="3"
               class="tolocha-control w-full px-4 py-2 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none"
               placeholder="admin">
      </div>
      <div>
        <label class="block text-sm mb-1">{{ _('Password') }}</label>
        <input type="password" name="password" required minlength="6"
               class="tolocha-control w-full px-4 py-2 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none"
               placeholder="{{ _('Choose a strong password') }}">
      </div>
      <div>
        <label class="block text-sm mb-1">{{ _('Confirm Password') }}</label>
        <input type="password" name="confirm" required minlength="6"
               class="tolocha-control w-full px-4 py-2 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none"
               placeholder="{{ _('Confirm password') }}">
      </div>
      <button type="submit"
              class="tolocha-primary w-full py-3 rounded font-semibold transition-colors">
        {{ _('Create Account') }}
      </button>
    </form>
  </div>
  <script src="/api/i18n.js"></script>
</body>
</html>
