<!DOCTYPE html>
<html lang="{{ lang or 'es-ES' }}" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ _('Login') }} - TolochaTV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/tolocha-theme.css?v={{ asset_version }}">
</head>
<body class="h-full bg-gray-900 text-gray-100 flex items-center justify-center tolocha-auth">
  <div class="tolocha-auth-card p-8 rounded-lg w-full max-w-md">
    <h1 class="tolocha-brand text-3xl font-bold text-center mb-8">TolochaTV</h1>
    {% if error %}
    <div class="tolocha-error mb-6 p-3 rounded text-center">
      {{ _('Invalid username or password') }}
    </div>
    {% endif %}
    <form method="POST" action="/login" class="space-y-6">
      <div>
        <label for="username" class="block text-lg mb-2">{{ _('Username') }}</label>
        <input type="text" id="username" name="username" value="{{ last_user }}" required {% if not last_user %}autofocus{% endif %}
               class="tolocha-control w-full px-4 py-3 rounded text-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <div>
        <label for="password" class="block text-lg mb-2">{{ _('Password') }}</label>
        <input type="password" id="password" name="password" required {% if last_user %}autofocus{% endif %}
               class="tolocha-control w-full px-4 py-3 rounded text-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <button type="submit"
              class="tolocha-primary w-full py-4 rounded text-xl font-semibold transition-colors">
        {{ _('Login') }}
      </button>
    </form>
  </div>
  <script src="/api/i18n.js"></script>
</body>
</html>
