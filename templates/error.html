{% extends "base.html" %}
{% block title %}{{ _('Error') }}{% endblock %}

{% block content %}
<div class="tolocha-error-page tolocha-surface flex flex-col items-center justify-center h-full gap-4 rounded-lg p-8 text-center">
  <div class="text-6xl">⚠️</div>
  <h1 class="text-2xl font-bold text-red-400">{{ title }}</h1>
  <p class="text-gray-400 text-center max-w-md">{{ message }}</p>
  <div class="flex gap-2 mt-4">
    <button onclick="location.reload()" class="tolocha-primary px-4 py-2 rounded focusable" tabindex="0">{{ _('Retry') }}</button>
    <button onclick="history.back()" class="tolocha-control px-4 py-2 rounded focusable" tabindex="0">{{ _('Go Back') }}</button>
  </div>
</div>
{% endblock %}
