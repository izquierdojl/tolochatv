schema: spec-driven

context: |
  TolochaTV: self-hosted IPTV player. Single FastAPI app (main.py) + flat Python modules — NOT a package.
  Modules are imported by filename (`import main`, `import cache`, ...), so name collisions matter and top-level files are the app.

  Stack:
  - Python 3.11 (do not use Python-3.12+ syntax)
  - FastAPI + Jinja2 templates (templates/) + static JS/CSS (static/)
  - SQLite for EPG (epg.py), file cache under `CACHE_DIR` (cache.py)
  - ffmpeg/ffprobe on PATH for the transcode pipeline (ffmpeg_command.py, ffmpeg_session.py)
  - Optional AI Upscale via TensorRT engines gated by `is_sr_available()`

  Commands (dev, uses uv):
  - Install deps: `uv sync --group dev`
  - Lint: `uv run ruff check .`
  - Typecheck: `uv run basedpyright`
  - Tests: `uv run pytest`
  - Run app: `uv run ./main.py --port 8000` (flags: --https, --cert FILE --key FILE, --debug)

  Code style:
  - Line length 100, type hints use PEP 604 (`X | None`) and `from __future__ import annotations` at the top of every module
  - No comments unless asked; follow existing module patterns
  - Never introduce code that exposes or logs secrets/stream credentials

  Testing:
  - pytest discovers `*_test.py` at repo root (testpaths = ["."], pythonpath = ["."])
  - Tests are fully mocked/offline (no network, no ffmpeg)
  - Importing `main` in a test requires the `mock_deps` fixture; don't import main at module top level
  - Background preload threads are patched via the `client`/`auth_client` fixtures

  Conventions:
  - Templates rely on filters registered in main.py (e.g. `logo_url`)
  - `tools/` holds ops scripts (install-*.sh, zap2xml.py, alignm3u.py, ...) — excluded from basedpyright; not part of the app

rules:
  proposal:
    - Mention which top-level modules (main.py, cache.py, epg.py, auth.py, ...) the change affects
    - Note how tests are affected (which *_test.py files)
  specs:
    - Use Given/When/Then format for scenarios
  design:
    - Reference concrete module/function names from the codebase, not hypothetical structure
  tasks:
    - Include a step to run `uv run ruff check .`, `uv run basedpyright`, and `uv run pytest`
    - Break tasks into chunks of max 2 hours